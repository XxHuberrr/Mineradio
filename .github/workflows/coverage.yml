name: Coverage

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.3.0
        with:
          node-version: '22.x'
          cache: 'npm'
      - run: npm ci
      - name: Run tests with coverage
        run: node --experimental-test-coverage scripts/run-ci-tests.js
        continue-on-error: true
      - name: Upload coverage report
        uses: actions/upload-artifact@4cec3d8ff04cdd1fb6cf4ec7956e212bb120db2b # v4.6.2
        with:
          name: coverage-report
          path: .coverage
          retention-days: 7
